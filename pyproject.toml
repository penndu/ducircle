[project]
name = "ducircle"
version = "0.1.0"
description = "友链朋友圈 — 面向博客主的公开友链聚合服务"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "penndu" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    # asyncmy 用于应用运行时（异步驱动）
    "asyncmy>=0.2.9",
    # pymysql 用于 Alembic 迁移（同步驱动更稳，DDL 不需要异步）
    # 漏了这个容器启动时 alembic upgrade 会报 No module named pymysql
    "pymysql>=1.1",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "selectolax>=0.3.21",
    "trafilatura>=1.12",
    "bcrypt>=4.2",
    "apscheduler>=3.10",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0",
    "pypinyin>=0.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # 测试用 SQLite 内存库跑，不需要真实 MySQL。
    # 漏了这个会让 CI 里 65 个测试用例全部 error。
    "aiosqlite>=0.20",
    # 迁移脚本用的同步驱动，生成迁移时会用到
    "pymysql>=1.1",
    "pyyaml>=6.0",
]

[project.scripts]
ducircle = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]