# 构建镜像并推送到 GitHub Container Registry。
#
# 服务器内存只有 1.7G，在上面跑 docker build 很容易 OOM，
# 把构建放到 GitHub Actions 上更稳妥——顺便还得到了
# 「代码没通过构建就不会部署」的保证。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   - 无。GITHUB_TOKEN 是 Actions 自动注入的，推 GHCR 够用。
#
# 首次使用前需要在 Packages 里把 GHCR 设为 public，
# 否则服务器 pull 会 403。

name: 构建与推送镜像

on:
  push:
    branches: [main]
  # 手动触发：改了 Dockerfile 或想重跑时用
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 构建阶段的依赖装全——运行时镜像保持精简
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 静态检查
        run: |
          echo "--- await 位置检查 ---"
          python scripts/check_await_usage.py
          echo "--- MySQL 方言兼容性 ---"
          python scripts/check_mysql_compat.py

      - name: 单元测试
        # 全部测试都跑——它们不依赖 MySQL/Redis（用 SQLite + mock）。
        # 需要真实数据库的验证是 scripts/verify_mysql.sh，
        # 那是本地/服务器上手动跑的，不进 CI。
        run: |
          pytest tests/ -q -p no:warnings

      # Buildx 对 QEMU 友好，arm64 服务器也能跑同一份镜像
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 构建成功才部署。避免把坏版本推上线。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 只有推 main 才部署，手动触发到别的分支时不发
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 触发服务器拉取
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/1panel/www/sites/ducircle.dusays.com/index
            git pull origin main
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            sleep 8
            docker logs --tail 30 ducircle