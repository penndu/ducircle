# 构建镜像并推送到 Docker Hub，然后自动部署到服务器。
#
# 服务器内存只有 1.7G，在上面跑 docker build 容易 OOM，
# 所以构建放在这里，服务器只负责 pull。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME — Docker Hub 用户名
#   DOCKERHUB_TOKEN    — Docker Hub 的 Access Token，不是登录密码
#                        （Docker Hub → Account settings → Personal access tokens）
#   SERVER_HOST        — www.dusays.com
#   SERVER_USER        — root
#   SERVER_SSH_KEY     — 部署用的私钥内容
#
# 注意：私钥进 GitHub Secrets 有泄露风险。这台服务器上还有其它服务在跑，
# 建议为部署专门生成一对密钥（见 docs/GitHub-Actions部署.md 第二节），
# 用完后把该私钥从本机 ~/.ssh 移除。

name: 构建与部署

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 是否部署到服务器
        type: boolean
        default: true

env:
  IMAGE_NAME: penndu/ducircle

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 静态检查
        run: |
          echo "--- await 位置检查 ---"
          python scripts/check_await_usage.py
          echo "--- MySQL 方言兼容性 ---"
          python scripts/check_mysql_compat.py
          echo "--- .dockerignore 未排除构建必需文件 ---"
          python scripts/check_dockerignore.py

      # 测试不过就不构建、不推送、不部署。
      # 这些测试抓到过3 个真 bug，其中一个是租户隔离的安全缺口。
      - name: 单元测试
        run: pytest tests/ -q -p no:warnings

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      # 只构建服务器实际需要的架构（amd64）。
      # 双架构构建要装 QEMU 模拟，编译 asyncmy 的 C 扩展时
      # 极慢且容易超时——上一版就是这么失败的。
      # 确实需要 arm64 时把下面改成 linux/amd64,linux/arm64，
      # 并在 job 里加上 setup-qemu-buildx-action。
      # 不用 build-push-action，自己跑 buildx 并把完整日志落盘。
      # action 的日志被 BuildKit 格式化后只剩 summary，
      # 真正的原因（比如 pip 报错）会丢——排查时拿不到。
      - name: 构建并推送
        run: |
          set -o pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f deploy/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --push \
            --progress=plain . 2>&1 | tee build.log
        continue-on-error: true

      # 把关键错误写进 commit status / job summary。
      # artifact 需要认证才能下载，但 summary 在 Actions 页面
      # 免登录可见——排查时能直接看到，不用先配 token。
      - name: 输出诊断信息
        if: always()
        run: |
          {
            echo "## 构建诊断"
            echo ""
            echo "### 上下文大小"
            echo '```'
            du -sh . 2>/dev/null || echo "(未知)"
            echo '```'
            echo ""
            echo "### 关键错误"
            echo '```'
            grep -iE "^ERROR|error:|OSError|Readme file|No matching|failed to solve|Traceback" build.log \
              | grep -v "^#" | head -25 || echo "(未匹配到错误行)"
            echo '```'
            echo ""
            echo "### 最后 20 行"
            echo '```'
            tail -20 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 上一步用了 continue-on-error，这里必须显式判定，
      # 否则构建失败也会标记为成功并继续部署——那会部署出坏镜像。
      - name: 校验构建结果
        run: |
          if grep -qE "^ERROR: failed to solve" build.log; then
            echo "构建失败，镜像未推送"
            grep -E "^#.*(ERROR|error:|Readme|No matching)" build.log | head -20 || true
            exit 1
          fi
          echo "构建成功"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # push main 总是部署；手动触发按输入决定
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy != false)
    steps:
      - name: 拉取并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # set -e 让任何一步失败就停下——
          # 健康检查不过时不报告成功，Actions 标记为失败。
          script: |
            set -e
            cd /opt/1panel/www/sites/ducircle.dusays.com/index

            echo "==> 拉取代码"
            git pull origin main

            echo "==> 拉取镜像"
            docker compose -f deploy/docker-compose.yml pull

            echo "==> 重启服务"
            docker compose -f deploy/docker-compose.yml up -d --remove-orphans

            echo "==> 等待启动（容器内要先跑迁移）"
            sleep 15

            echo "==> 健康检查"
            if ! curl -fsS http://127.0.0.1:9527/health; then
              echo ""
              echo "健康检查失败，容器日志："
              docker logs --tail 50 ducircle 2>&1
              exit 1
            fi
            echo ""
            echo "部署成功"

      - name: 部署后验证
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 无论成功失败都跑，把现场信息带回来便于排查
          script: |
            echo "=== 容器状态 ==="
            docker ps --filter name=ducircle --format "table {{.Names}}\t{{.Status}}"
            echo "=== 启动日志 ==="
            docker logs --tail 30 ducircle 2>&1 | grep -v "^$" | tail -20