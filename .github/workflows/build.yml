# 构建镜像并推送到 Docker Hub。**不做自动部署。**
#
# 为什么不在这里自动部署：
# 部署意味着 SSH 私钥要放进 GitHub Secrets，有泄露风险——一旦泄露，
# 攻击者能以 root 登进服务器。而这台机器上还跑着 artalk、memos、
# phpmyadmin 等服务，牵连面太大。手动部署用本机的密钥更可控：
#   ssh dusays
#   cd /opt/1panel/www/sites/ducircle.dusays.com/index
#   git pull && IMAGE_TAG=<版本> docker compose -f deploy/docker-compose.yml up -d
#
# 为什么构建要放在 CI：
# 服务器内存只有 1.7G，在上面跑 docker build 会 OOM。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME — Docker Hub 用户名
#   DOCKERHUB_TOKEN    — Docker Hub 的 Access Token，不是登录密码
#                        （Docker Hub → Account settings → Personal access tokens）
# 只有这两个，不需要任何服务器相关的密钥。

name: 构建镜像

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: penndu/ducircle

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # 需要 write 才能往 commit 上写构建结果评论。
      # 那个评论记录了确切的时间戳标签——服务器部署要用它，
      # 因为 Docker Hub 的 latest manifest 有 CDN 缓存，
      # 直接 pull latest 可能拿到旧的。
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 静态检查
        run: |
          echo "--- await 位置检查 ---"
          python scripts/check_await_usage.py
          echo "--- MySQL 方言兼容性 ---"
          python scripts/check_mysql_compat.py
          echo "--- .dockerignore 未排除构建必需文件 ---"
          python scripts/check_dockerignore.py
          echo "--- workflow 结构 ---"
          python scripts/check_workflow.py
          echo "--- MySQL SQL 兼容性 ---"
          python scripts/check_mysql_sql.py
          echo "--- 后台任务静默失败检查 ---"
          python scripts/check_background_tasks.py

      # 测试不过就不构建、不推送、不部署。
      # 这些测试抓到过3 个真 bug，其中一个是租户隔离的安全缺口。
      - name: 单元测试
        run: pytest tests/ -q -p no:warnings

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只构建服务器实际需要的架构（amd64）。
      # 双架构构建要装 QEMU 模拟，编译 asyncmy 的 C 扩展时
      # 极慢且容易超时——上一版就是这么失败的。
      # 确实需要 arm64 时把下面改成 linux/amd64,linux/arm64，
      # 并在 job 里加上 setup-qemu-buildx-action。
      # 不用 build-push-action，自己跑 buildx 并把完整日志落盘。
      # action 的日志被 BuildKit 格式化后只剩 summary，
      # 真正的原因（比如 pip 报错）会丢——排查时拿不到。
      # 时间戳标签：202610221200 这样的 12 位数字。
      # 用 TZ=Asia/Shanghai 保证和服务器时区一致，
      # 否则 UTC 时间会比本地早 8 小时，看日志时容易误判新旧。
      - name: 生成版本标签
        id: ver
        run: |
          TAG=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "构建版本: $TAG" >> "$GITHUB_STEP_SUMMARY"

      # 用原生 docker build + push，不用 buildx。
      #
      # 之前用 buildx --push 时出现过「CI 显示 Success，
      # 但 Docker Hub 上的镜像没更新」——查了很久才定位到是
      # buildx 的缓存行为。原生 docker build 的行为更直白：
      # 构建完就是本地镜像，push 就是推上去。
      # 只构建 amd64（服务器是 x86），不需要 buildx 的多架构能力。
      - name: 构建并推送
        env:
          VERSION_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          echo "==> 构建"
          docker build \
            --build-arg BUILD_VERSION="$VERSION_TAG" \
            --build-arg BUILD_TIME="$(TZ=Asia/Shanghai date -Iseconds)" \
            -f deploy/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:"$VERSION_TAG" \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            . 2>&1 | tee build.log

          echo ""
          echo "==> 推送"
          # 逐个标签推，任何一个失败都会让步骤失败
          for tag in latest "$VERSION_TAG" "${{ github.sha }}"; do
            echo "--- push ${{ env.IMAGE_NAME }}:$tag ---"
            docker push ${{ env.IMAGE_NAME }}:"$tag"
          done

          echo ""
          echo "==> 推送后的本地镜像信息"
          docker images --digests ${{ env.IMAGE_NAME }} \
            --format "{{.Tag}}  {{.Digest}}  {{.ID}}"

      # 从 Docker Hub 把刚推的镜像拉回来，验证内容确实是新的。
      #
      # 为什么要多这一步：之前出现过「CI 显示 Success，
      # 但 Docker Hub 上的镜像没更新」——服务器 pull 下来的
      # 还是旧代码，排查了很久才发现是构建缓存命中跳过了实际构建。
      # 这一步把问题挡在 CI 阶段：拉回来检查 BUILD_VERSION
      # 是不是本次的版本号。
      - name: 验证推送的镜像
        if: always()
        env:
          VERSION_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "### 推送验证"
            echo ""
            echo "构建版本: $VERSION_TAG"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # 先删本地镜像——否则 pull 会命中本地缓存，
          # 验证的就是刚构建的那份，不是 Docker Hub 上的。
          docker rmi -f ${{ env.IMAGE_NAME }}:"$VERSION_TAG" >/dev/null 2>&1 || true

          # 拉回来，看容器里带的版本号对不对
          if docker pull ${{ env.IMAGE_NAME }}:"$VERSION_TAG" 2>/dev/null; then
            GOT=$(docker run --rm --entrypoint printenv \
              ${{ env.IMAGE_NAME }}:"$VERSION_TAG" DUCIRCLE_VERSION 2>/dev/null)
            echo "拉回来的镜像版本: ${GOT:-（读不到）}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$GOT" = "$VERSION_TAG" ]; then
              echo "✓ 镜像内容正确" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ 镜像版本不符：期望 $VERSION_TAG，实际 ${GOT:-未知}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "❌ 无法拉取 ${{ env.IMAGE_NAME }}:$VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 把构建结果写到 commit 评论。
      #
      # 为什么要这么绕：Docker Hub 的 manifest 有 CDN 缓存，
      # 短时间内 pull latest 可能拿到旧的 manifest（digest 不变）。
      # 时间戳标签没有这个问题，但必须知道确切标签名——
      # 写进 commit 评论后，服务器部署脚本就能读到它。
      #
      # commit 评论是公开的（仓库是公开的），不需要额外认证就能读。
      - name: 记录构建结果
        if: always()
        env:
          VERSION_TAG: ${{ steps.ver.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          DIGEST=$(docker images --digests ${{ env.IMAGE_NAME }}:latest \
            --format "{{.Digest}}" 2>/dev/null | head -1)
          BODY=$(printf '### 镜像构建\n\n- 版本标签: `%s`\n- 镜像 digest: `%s`\n- commit: `%s`\n\n部署命令：\n\n```bash\ncd /opt/1panel/www/sites/ducircle.dusays.com/index\ngit pull origin main\nIMAGE_TAG=%s docker compose -f deploy/docker-compose.yml pull\nIMAGE_TAG=%s docker compose -f deploy/docker-compose.yml up -d\n```' \
            "$VERSION_TAG" "${DIGEST:-未知}" "${{ github.sha }}" \
            "$VERSION_TAG" "$VERSION_TAG")

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(printf '{"body": %s}' "$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
            > /dev/null || echo "写 comment 失败（不影响构建）"

          {
            echo "### 构建结果"
            echo ""
            echo "- 版本标签: \`$VERSION_TAG\`"
            echo "- digest: \`${DIGEST:-未知}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 把关键错误写进 commit status / job summary。
      # artifact 需要认证才能下载，但 summary 在 Actions 页面
      # 免登录可见——排查时能直接看到，不用先配 token。
      - name: 输出诊断信息
        if: always()
        run: |
          {
            echo "## 构建诊断"
            echo ""
            echo "### 上下文大小"
            echo '```'
            du -sh . 2>/dev/null || echo "(未知)"
            echo '```'
            echo ""
            echo "### 推送的镜像（digest 是关键）"
            echo '```'
            grep -E "digest: sha256|pushing|pushed|exporting manifest" build.log \
              | tail -12 || echo "(未找到 push 记录)"
            echo '```'
            echo ""
            echo "### 关键错误"
            echo '```'
            grep -iE "^ERROR|error:|OSError|Readme file|No matching|failed to solve|Traceback" build.log \
              | grep -v "^#" | head -25 || echo "(未匹配到错误行)"
            echo '```'
            echo ""
            echo "### 最后 20 行"
            echo '```'
            tail -20 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 上一步用了 continue-on-error，这里必须显式判定，
      # 否则构建失败也会标记为成功并继续部署——那会部署出坏镜像。
      - name: 校验构建结果
        run: |
          if grep -qE "^ERROR: failed to solve" build.log; then
            echo "构建失败，镜像未推送"
            grep -E "^#.*(ERROR|error:|Readme|No matching)" build.log | head -20 || true
            exit 1
          fi
          echo "构建成功"
