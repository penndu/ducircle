# 1Panel 环境下的编排。
#
# 镜像由 GitHub Actions 构建并推到 Docker Hub，服务器只负责拉取——
# 这台机器只有 1.7G 内存，在上面跑 docker build 容易 OOM。
#
# 部署前确认：
#   1. .env 已填好密码（不要提交到 git）
#   2. 容器已接入 1Panel 的 MySQL/Redis 所在网络
#      （1Panel 默认给每个容器建独立网络，需要手动加入）
#   3. Docker Hub 仓库已创建（公开拉取不需要额外设置）
services:
  app:
    image: penndu/ducircle:latest
    container_name: ducircle
    restart: unless-stopped
    env_file: ../.env
    ports:
      # 反代上游。1Panel 反向代理指向 http://127.0.0.1:9527
      - "127.0.0.1:9527:8000"
    volumes:
      - logs:/app/logs
    # 抓取并发高，限制 CPU 避免吃满整机。
    # 内存留 700M——应用实际用不到 400M，剩下的给 MySQL。
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 700M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  logs: