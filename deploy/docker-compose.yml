# 1Panel 环境下的编排。
#
# 镜像由 GitHub Actions 构建并推到 Docker Hub，服务器只负责拉取——
# 这台机器只有 1.7G 内存，在上面跑 docker build 容易 OOM。
#
# 部署前确认：
#   1. .env 已填好密码（不要提交到 git）
#   2. 1panel-network 网络存在（1Panel 托管的容器都在这个网络上）
services:
  app:
    # 默认拉 latest。部署时可以传 IMAGE_TAG 环境变量指定具体版本：
    #   IMAGE_TAG=202610221200 docker compose -f deploy/docker-compose.yml up -d
    # 这样回滚只要改一个版本号，不用改文件、不污染工作区。
    image: penndu/ducircle:${IMAGE_TAG:-latest}
    container_name: ducircle
    # always：每次 up 都重新拉。
    # 默认的 missing 策略只在本地没这个镜像时才拉——
    # 本地有了 latest 就永远不更新，结果是「以为部署了新版本，
    # 实际跑的还是旧镜像」。这个坑我踩过一次。
    pull_policy: always
    restart: unless-stopped
    env_file: ../.env
    ports:
      # 反代上游。1Panel 反向代理指向 http://127.0.0.1:9527
      - "127.0.0.1:9527:8000"
    volumes:
      - logs:/app/logs
    # 抓取并发高，限制 CPU 避免吃满整机。
    # 内存留 700M——应用实际用不到 400M，剩下的给 MySQL。
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 700M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 必须接入 1Panel 的网络才能解析到 1Panel-mysql-wQr4 和
    # 1Panel-redis-29uO。写在 compose 里而不是让人手动在面板上点，
    # 是因为这一步最容易漏——漏了容器连不上库，
    # 现象是「应用起来了但 /health 说 db: down」，很难立刻联想到网络。
    networks:
      - 1panel-network

networks:
  1panel-network:
    # 外部网络：1Panel 建的，不是 compose 建的
    external: true

volumes:
  logs: